---
- name: Install Docker (Ubuntu package)
  ansible.builtin.apt:
    name: docker.io
    state: present

- name: Make sure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Let the ubuntu user run docker without sudo
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true
