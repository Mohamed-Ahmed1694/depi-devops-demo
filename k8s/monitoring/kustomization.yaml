apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - namespace.yaml
  - prometheus.yaml
  - grafana.yaml

# Config files live in ./config so docker-compose can reuse them
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=config/prometheus-k8s.yml
  - name: grafana-datasources
    files:
      - datasource.yml=config/grafana-datasource.yml
  - name: grafana-dashboard-provider
    files:
      - provider.yml=config/grafana-dashboard-provider.yml
  - name: grafana-dashboards
    files:
      - demo-app.json=config/demo-app-dashboard.json
